name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    # Preflight rules, metrics and CLI wiring. No downloads, server or models.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not realdata"
      - run: qdrant-hybrid-preflight --help
